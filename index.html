<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Buraco Online 1v1</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0b1329;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Lobby */
    #lobby-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, #1e293b 0%, #0b1329 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .card-lobby {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }

    .card-lobby h2 {
      margin: 0 0 4px 0;
      color: #38bdf8;
    }

    .card-lobby input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      text-align: center;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-green { background: #22c55e; color: #0f172a; }
    .btn-blue { background: #38bdf8; color: #0f172a; }
    .btn-orange { background: #f97316; color: #fff; }
    .btn-zap { background: #25d366; color: #fff; font-weight: bold; }

    /* Mesa de Jogo */
    #game-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      background: #155e34;
    }

    .header-mesa {
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .btn-convite-header {
      background: #25d366;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .placar-jogadores {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px;
      font-size: 0.85rem;
    }

    .tag-jogador {
      padding: 4px 10px;
      border-radius: 6px;
      background: #334155;
    }

    .tag-jogador.ativo {
      background: #facc15;
      color: #000;
      font-weight: bold;
    }

    /* Centro da Mesa */
    .centro-mesa {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      gap: 12px;
      overflow-y: auto;
    }

    .pilhas-mesa {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .jogos-mesa {
      width: 100%;
      min-height: 85px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    /* Cartas */
    .carta {
      width: 50px;
      height: 72px;
      background: #fff;
      color: #000;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px;
      font-size: 0.9rem;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      cursor: pointer;
      position: relative;
    }

    .carta.vermelha { color: #dc2626; }
    .carta.preta { color: #0f172a; }
    .carta.verso {
      background: #1e3a8a;
      border: 2px solid #fff;
    }

    .carta.selecionada {
      transform: translateY(-12px);
      box-shadow: 0 0 12px #facc15;
      border: 2px solid #facc15;
    }

    /* Mão do Jogador */
    .rodape-jogador {
      background: rgba(0, 0, 0, 0.6);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .acoes-turno {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .btn-acao {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .minha-mao {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 4px;
      min-height: 88px;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- Tela Inicial (Lobby) -->
  <div id="lobby-screen">
    <div class="card-lobby">
      <h2>🃏 Buraco 1v1</h2>
      <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 12px;">Crie a sala e mande o link pro WhatsApp</p>

      <input type="text" id="nome-jogador" placeholder="Seu Nome / Apelido" maxlength="12">

      <div id="painel-criador">
        <button class="btn btn-green" onclick="criarSala()">🎮 CRIAR NOVA SALA</button>
      </div>

      <!-- Aparece se a pessoa abriu direto com o link de convite -->
      <div id="painel-convidado" style="display: none;">
        <p id="msg-convite" style="color: #38bdf8; font-weight: bold; font-size: 0.9rem;"></p>
        <button class="btn btn-blue" onclick="entrarSalaViaLink()">ENTRAR NA PARTIDA</button>
      </div>

      <div id="status-conexao" style="margin-top: 12px; font-size: 0.85rem; color: #facc15;"></div>
    </div>
  </div>

  <!-- Tela da Partida -->
  <div id="game-screen">
    <div class="header-mesa">
      <div>Sala: <span id="lbl-sala">---</span></div>
