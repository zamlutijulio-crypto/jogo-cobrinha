<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Buraco Online 1v1 (2 Jogadores)</title>
  <!-- PeerJS para conexão direta e gratuita entre os 2 celulares -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0d47a1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Lobby */
    #lobby-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0b1e36;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .card-lobby {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .card-lobby input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      text-align: center;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-green { background: #22c55e; color: #0f172a; }
    .btn-blue { background: #38bdf8; color: #0f172a; }
    .btn-orange { background: #f97316; color: #fff; }

    /* Mesa de Jogo */
    #game-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      background: #1b5e20;
    }

    .header-mesa {
      background: rgba(0, 0, 0, 0.45);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .placar-jogadores {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px;
      font-size: 0.85rem;
    }

    .tag-jogador {
      padding: 4px 10px;
      border-radius: 4px;
      background: #334155;
    }

    .tag-jogador.ativo {
      background: #facc15;
      color: #000;
      font-weight: bold;
    }

    /* Centro */
    .centro-mesa {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      gap: 12px;
      overflow-y: auto;
    }

    .pilhas-mesa {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .jogos-mesa {
      width: 100%;
      min-height: 90px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    /* Cartas */
    .carta {
      width: 50px;
      height: 72px;
      background: #fff;
      color: #000;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px;
      font-size: 0.9rem;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      cursor: pointer;
      position: relative;
    }

    .carta.vermelha { color: #dc2626; }
    .carta.preta { color: #0f172a; }
    .carta.verso {
      background: #1e3a8a;
      border: 2px solid #fff;
    }

    .carta.selecionada {
      transform: translateY(-12px);
      box-shadow: 0 0 12px #facc15;
      border: 2px solid #facc15;
    }

    /* Mão do Jogador */
    .rodape-jogador {
      background: rgba(0, 0, 0, 0.6);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .acoes-turno {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .btn-acao {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .minha-mao {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 4px;
      min-height: 88px;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- Lobby de Conexão -->
  <div id="lobby-screen">
    <div class="card-lobby">
      <h2>🃏 Buraco 1v1 Online</h2>
      <p style="color: #94a3b8; font-size: 0.85rem;">Partida direta para 2 jogadores</p>

      <input type="text" id="nome-jogador" placeholder="Seu Nome" maxlength="10">
      <input type="text" id="codigo-sala" placeholder="Código da Sala (ex: MESA1)" style="text-transform: uppercase;">

      <button class="btn btn-green" onclick="criarSala()">CRIAR SALA (Jogador 1)</button>
      <button class="btn btn-blue" onclick="entrarSala()">ENTRAR NA SALA (Jogador 2)</button>

      <div id="status-conexao" style="margin-top: 12px; font-size: 0.85rem; color: #facc15;"></div>
    </div>
  </div>

  <!-- Mesa de Jogo -->
  <div id="game-screen">
    <div class="header-mesa">
      <div>Sala: <span id="lbl-sala">---</span></div>
      <div id="status-turno" style="color: #facc15;">Aguardando Jogador 2...</div>
    </div>

    <!-- Indicador dos 2 Jogadores -->
    <div class="placar-jogadores">
      <div class="tag-jogador" id="tag-j0">J1: Aguardando</div>
      <div class="tag-jogador" id="tag-j1">J2: Aguardando</div>
    </div>

    <!-- Centro da Mesa -->
    <div class="centro-mesa">
      <div class="pilhas-mesa">
        <!-- Monte -->
        <div style="text-align: center;">
          <div class="carta verso" onclick="comprarMonte()">
            <span style="font-size: 0
