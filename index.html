<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cobrinha: Lucky Block Edition</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 10px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .painel {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
      font-size: 1rem;
      margin-bottom: 6px;
      font-weight: bold;
    }

    #aviso-efeito {
      min-height: 24px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #facc15;
      margin-bottom: 6px;
      text-align: center;
      transition: all 0.2s;
    }

    .canvas-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      background-color: #1e293b;
      border: 3px solid #38bdf8;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      max-width: 92vw;
      max-height: 44vh;
    }

    .overlay {
      display: none;
      position: absolute;
      background: rgba(15, 23, 42, 0.96);
      padding: 18px;
      border-radius: 10px;
      border: 2px solid #38bdf8;
      text-align: center;
      width: 88%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
    }

    .overlay h2 {
      margin: 0 0 10px 0;
      font-size: 1.3rem;
    }

    .dificuldades {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .btn-dif {
      background-color: #334155;
      color: #f8fafc;
      border: 2px solid #475569;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-dif.ativo {
      background-color: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }
